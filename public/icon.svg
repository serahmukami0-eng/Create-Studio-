<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131C"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle for Android -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Tech Grid Accent Lines -->
  <path d="M 64 256 L 448 256 M 256 64 L 256 448" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.12" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.15"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 6"/>

  <!-- Glowing Studio Brand Emblem (M Monogram + Creative Stylus) -->
  <g filter="url(#glow)">
    <!-- Stylized Modern M -->
    <path d="M 140 360 L 140 160 L 256 280 L 372 160 L 372 360" fill="none" stroke="url(#goldGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Stylus / Brush Apex Tip -->
    <path d="M 256 120 L 272 165 L 240 165 Z" fill="url(#cyanGrad)"/>
    <circle cx="256" cy="115" r="7" fill="#38BDF8"/>

    <!-- Bottom Tech Dot Accent -->
    <circle cx="256" cy="360" r="10" fill="url(#goldGrad)"/>
  </g>

  <!-- Studio Subtext Accent -->
  <text x="256" y="425" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#F4F4F5" letter-spacing="6">MUKAMI</text>
  <text x="256" y="455" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#F59E0B" letter-spacing="4">STUDIO · KENYA</text>
</svg>
